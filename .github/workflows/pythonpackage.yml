# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test and deploy

on:
  push:
    branches: [ main ]
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: "${{matrix.os}}"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install MICOM and development dependencies
      run: uv sync --locked --group test --group lint
    - name: Lint
      run: |
        uv run ruff check .
        uv run ruff format --check micom tests
    - name: Test with pytest
      run: uv run pytest --cov=micom --cov-report=xml tests
    - name: Upload to codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@v7.1.1
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  release:
      needs: test
      if: startsWith(github.ref, 'refs/tags')
      runs-on: ubuntu-latest

      steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Publish distributions
        run: uv publish
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: 'dist/*'
          body: |
            Please see https://micom-dev.github.io/micom/NEWS.html for the full release notes.
          draft: false
          prerelease: false
